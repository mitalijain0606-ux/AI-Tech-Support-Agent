<!doctype html><title>secrets in the console</title><script>
// A page that logs credential-shaped strings (assembled at runtime; none is
// real) next to legitimate git commit ids. The extension must redact the
// former before upload and keep the latter.
const token = ["gh", "p_", "A1b2C3d4E5f6G7h8J9k0", "A1b2C3d4E5f6G7h8J9k0"].join("");
const sha = "3f786850e387550fdab836ed7e6dc881de23001b";
setInterval(() => {
  console.error(`TypeError: request to /api/user failed (auth ${token})`);
  console.error(`Error: build HEAD is at ${sha} but asset hash mismatched`);
  console.error(`Error: failed https://cdn.example.test/app.js?token=${sha}`);
}, 700);
</script><p>page that leaks secrets into its console</p>
