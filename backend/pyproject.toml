[project]
name = "operon-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "fastembed",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["operon_backend*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends(...) in a default argument is the framework's
# documented dependency-injection idiom, not the footgun this rule assumes.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
