name: CI

# Every push and pull request: lint, type-check, unit tests, build, and the
# real-database / real-browser suites. No job needs a secret: the model is
# exercised through the offline engine, and live-Groq tests skip without a key.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPERON_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      OPERON_TEST_REDIS_URL: redis://localhost:6379/0
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-all-MiniLM-L6-v2
      - name: Install (hash-locked)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Knowledge-base lint
        run: python ../docs/knowledge-base/scripts/kb_lint.py
      - name: Migrations apply cleanly to an empty database
        run: alembic -x url=sqlite:///./ci-migrate.db upgrade head
      - name: Tests (offline suite, real Postgres + pgvector, real Redis, real embedding model)
        run: pytest --ignore=tests/live -q
      - name: Evaluation fixtures (offline engine; fails on any unsafe action)
        run: python eval.py --engine offline
      - name: Dependency audit
        run: pip-audit -r requirements.txt --strict

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npm test
      - name: Build (github target)
        run: npm run build -- github
      - name: Buggy Cloud unit tests
        run: npm test
        working-directory: buggy-cloud
      - name: SDK unit tests (config, transport, evidence, flow, carrier, built script)
        run: npm test
        working-directory: sdk
      - name: SDK syntax check and TypeScript declarations
        run: |
          node --check sdk/operon-sdk.js && node --check sdk/redact.js
          extension/node_modules/.bin/tsc --noEmit --strict --module esnext --moduleResolution bundler --target es2022 --skipLibCheck sdk/operon-sdk.d.ts sdk/redact.d.ts
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  browser-e2e:
    # The built extension, in Chromium, against a real backend process.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, extension]
    env:
      OPERON_E2E_PYTHON: python
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-all-MiniLM-L6-v2
      - run: pip install --require-hashes -r backend/requirements.txt
      - run: npm ci
        working-directory: extension
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: extension
      - name: Deterministic browser E2E
        run: npm run e2e
        working-directory: extension
      - name: Browser-level wire test (free text is redacted before it leaves the browser)
        run: npm run e2e:wire
        working-directory: extension
      - name: SDK in Buggy Cloud against the real backend (no extension; approve, reject, failure paths)
        run: npm run e2e:sdk
        working-directory: extension
      - name: Whole local project starts and answers (scripts/dev-local.mjs --check)
        run: node scripts/dev-local.mjs --check
        env:
          OPERON_PYTHON: python
      - name: SDK wire test (fake secrets never appear in a request body)
        run: npm run e2e:sdk-wire
        working-directory: extension
      - name: Second-app browser E2E (Buggy Cloud, 7 seeded bugs)
        run: npm run e2e:buggy
        working-directory: extension
