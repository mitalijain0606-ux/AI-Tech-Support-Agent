[project]
name = "operon-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "fastembed",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["operon_backend*"]

[tool.setuptools.package-data]
operon_backend = ["dashboard/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit, so a newer ruff (whose defaults grow) cannot change what CI enforces.
select = ["E4", "E7", "E9", "F"]
# B008: FastAPI's Depends(...) in a default argument is the framework's
# documented dependency-injection idiom, not the footgun this rule assumes.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# tests/conftest.py must set DATABASE_URL before anything imports the application
# (settings are read at import time), so its imports are deliberately not at the top.
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_embeddings: needs the real embedding model (first use downloads ~90 MB from huggingface.co)",
    "live_groq: needs GROQ_API_KEY and network access to api.groq.com",
]
