# Render blueprint: the Operon backend, plus the NexaDesk demo app.  https://render.com/docs/blueprint-spec
#
# Why Render (a long-lived web service) and not a serverless platform: the API
# keeps Server-Sent-Events connections open for minutes, holds an in-process
# event bus, and loads a ~90 MB ONNX embedding model at start. See
# docs/DEPLOYMENT.md for the full reasoning and the manual steps.
#
# NOTHING IN THIS FILE HAS BEEN DEPLOYED. Secrets are `sync: false`: Render asks
# for them in the dashboard; they are never stored in this repository.
services:
  - type: web
    name: operon-backend
    runtime: python
    rootDir: backend
    plan: free               # free instances sleep after 15 idle minutes (first request then takes about a minute)
    region: singapore
    healthCheckPath: /health
    buildCommand: >-
      pip install --require-hashes -r requirements.txt &&
      python scripts/warm_model.py
    # Migrations run before the server starts; production refuses to start on a database that is behind.
    startCommand: >-
      alembic upgrade head &&
      uvicorn operon_backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: AUTH_REQUIRED
        value: "true"
      - key: LOG_FORMAT
        value: json
      - key: TRUST_FORWARDED_FOR      # Render's proxy appends the client address to X-Forwarded-For
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FASTEMBED_CACHE_PATH     # inside the project dir, so the model downloaded at build time is deployed
        value: /opt/render/project/src/backend/.cache/fastembed
      - key: DATABASE_URL             # Neon (Postgres with pgvector): the pooled or direct connection string
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL                # Upstash / Render Key Value; needed once there is more than one instance
        sync: false
      - key: CORS_ALLOW_ORIGINS       # the NexaDesk URL (exact https origin), so its support widget may call the API
        sync: false

  # NexaDesk, the demo app with 8 reproducible bugs, and its "reports" API. The reports API
  # must be a different origin from the app (scenario 6 is a cross-origin CORS fault), so it is
  # its own service. Both are stateless; free instances are fine (first load after idle is slow).
  - type: web
    name: nexadesk
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: node --version
    startCommand: node buggy-cloud/server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REPORTS_API_URL          # https URL of the nexadesk-reports service
        sync: false
      - key: OPERON_BACKEND_URL       # https URL of operon-backend; with the token, shows the support widget
        sync: false
      - key: OPERON_DEMO_TOKEN        # handed to every visitor: a user key of a demo-only tenant, with an expiry
        sync: false
  - type: web
    name: nexadesk-reports
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: node --version
    startCommand: node buggy-cloud/server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXADESK_MODE
        value: reports
      - key: APP_ORIGIN               # https URL of the nexadesk service (CORS for its reports request)
        sync: false
